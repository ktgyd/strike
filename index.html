<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b1a2b">
<title>3D 야구 · 한 이닝</title>
<style>
:root{--p:min(46vw,34vh,236px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}

/* ---------- 메뉴 ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#menu>*{pointer-events:auto}
.title{text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.6);pointer-events:none!important}
.title h1{margin:4px 0 0;font-size:clamp(26px,7.5vw,46px);font-weight:900;letter-spacing:1px}
.title p{margin:4px 0 0;font-size:clamp(12px,3.6vw,16px);opacity:.92}
.panel{width:100%;max-width:560px;margin:0 auto;background:rgba(8,18,34,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:16px;font-weight:800}
.seg button.on{background:linear-gradient(135deg,#ffb020,#ff6a1a);border-color:#ffd37a;color:#1a1100}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chars button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:13px;font-weight:800}
.chars button i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
.chars button.on{border-color:#ffd37a;background:rgba(255,211,122,.16)}
#cdesc{margin:9px 2px 6px;font-size:13px;opacity:.9;min-height:18px}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.st{display:flex;align-items:center;gap:6px;font-size:12px}
.st span{width:26px;font-weight:700}
.st i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.st u{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#facc15);border-radius:4px}
.st.dim{opacity:.4}
.big{width:100%;margin-top:11px;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,#ffb020,#ff5a1a);color:#1a0d00;font-size:18px;font-weight:900;box-shadow:0 6px 18px rgba(255,106,26,.4)}
.big:active{transform:scale(.98)}
@media (orientation:landscape) and (max-height:520px){
  #menu{flex-direction:row;align-items:stretch}
  .title{align-self:flex-start;text-align:left}
  .panel{margin:0 0 0 auto;max-width:380px;align-self:center;padding:10px}
  .seg{margin-bottom:6px}.seg button{padding:8px}
  .big{margin-top:8px;padding:11px}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.card{position:absolute;top:max(10px,env(safe-area-inset-top));background:rgba(8,18,34,.72);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#topL{left:10px}
#tag{font-weight:800;font-size:13px;margin-bottom:5px;white-space:nowrap}
.cnt{display:flex;align-items:center;font-weight:800;font-size:12px}
.cnt span{opacity:.75;margin:0 3px 0 8px}.cnt span:first-child{margin-left:0}
.dots b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:rgba(255,255,255,.18)}
.dots b.on.b{background:#4ade80}.dots b.on.s{background:#fbbf24}.dots b.on.o{background:#f87171}
#topR{right:10px;display:flex;gap:12px;align-items:center}
#dia{position:relative;width:48px;height:44px}
#dia b{position:absolute;width:13px;height:13px;transform:rotate(45deg);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55)}
#dia b.on{background:#ffd23a;border-color:#fff}
#dia .b2{left:17px;top:1px}#dia .b3{left:3px;top:15px}#dia .b1{right:3px;top:15px}#dia .hm{left:17px;bottom:1px;background:rgba(255,255,255,.5)}
#sc{text-align:center;line-height:1}
#sc small{display:block;font-size:10px;opacity:.75;margin-bottom:3px}
#sc strong{font-size:26px;font-weight:900}
#info2{position:absolute;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 76px);font-size:12px;font-weight:700;background:rgba(8,18,34,.6);padding:4px 9px;border-radius:10px;opacity:0;transition:opacity .2s}
#info2.show{opacity:1}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-size:clamp(34px,10vw,72px);letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.75);opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s;padding:0 10px;line-height:1.1}
#banner.show{opacity:1;transform:scale(1)}
#banner.strike{color:#ffd23a}#banner.ball{color:#7dd3fc}#banner.out{color:#fca5a5}#banner.hit{color:#86efac}#banner.foul{color:#e5e7eb}
#banner.hr{color:#ffd23a;font-size:clamp(44px,14vw,98px)}
#banner small{display:block;font-size:.34em;letter-spacing:0;margin-top:8px;color:#fff;font-weight:700}
#fb{position:absolute;left:0;right:0;top:50%;text-align:center;font-weight:900;font-size:clamp(18px,5.2vw,30px);opacity:0;transition:opacity .15s;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#fb.show{opacity:1}

/* ---------- 컨트롤 ---------- */
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 12px max(14px,env(safe-area-inset-bottom));pointer-events:none}
#ctrl>*{pointer-events:auto}
#pad{position:relative;flex:none;width:calc(var(--p)*.846);height:var(--p);background:rgba(8,18,34,.55);border:1px solid rgba(255,255,255,.28);border-radius:14px;overflow:hidden;touch-action:none}
#padc{width:100%;height:100%;display:block}
#padlbl{position:absolute;left:7px;top:4px;font-size:10px;opacity:.75;pointer-events:none;font-weight:700}
#mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}
#ptypes{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:240px}
#ptypes button{padding:11px 2px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(8,18,34,.68);color:#fff;font-weight:800;font-size:14px}
#ptypes button.on{background:linear-gradient(135deg,#ffb020,#ff6a1a);color:#1a1100;border-color:#ffd37a}
#hint{font-size:11px;opacity:.85;text-align:center;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#act{flex:none;width:calc(var(--p)*.68);height:calc(var(--p)*.68);border-radius:50%;border:3px solid #ffe08a;background:radial-gradient(circle at 35% 30%,#ffd35a,#ff6a1a);color:#2a1300;font-size:clamp(16px,4.6vw,22px);font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#act:active{transform:scale(.94)}
#act:disabled{filter:grayscale(.85) brightness(.7)}

/* ---------- 결과 ---------- */
#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,10,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px}
#endbox{width:100%;max-width:420px;background:rgba(12,24,44,.95);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px 18px;text-align:center}
#endTitle{margin:0 0 4px;font-size:24px;font-weight:900}
#endGrade{font-size:68px;font-weight:900;line-height:1.1;background:linear-gradient(135deg,#ffd23a,#ff6a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
#endSub{opacity:.85;font-size:14px;margin-bottom:12px}
#endStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
#endStats div{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 6px;font-size:12px}
#endStats b{display:block;font-size:20px;margin-top:2px}
.endbtns{display:flex;gap:8px}
.endbtns button{flex:1;padding:13px;border-radius:13px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-weight:800;font-size:15px}
.endbtns button.pri{background:linear-gradient(135deg,#ffb020,#ff5a1a);color:#1a0d00;border-color:#ffd37a}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="title"><h1>⚾ 3D 야구 · 한 이닝</h1><p id="sub"></p></div>
  <div class="panel">
    <div class="seg" id="modeSeg"><button data-m="pitcher" class="on">⚾ 투수</button><button data-m="batter">🏏 타자</button></div>
    <div class="chars" id="chars"></div>
    <div id="cdesc"></div>
    <div id="stats"></div>
    <button id="start" class="big">게임 시작</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="card" id="topL">
    <div id="tag"></div>
    <div class="cnt"><span>B</span><div class="dots" id="dB"></div><span>S</span><div class="dots" id="dS"></div><span>OUT</span><div class="dots" id="dO"></div></div>
  </div>
  <div class="card" id="topR">
    <div id="dia"><b class="b2"></b><b class="b3"></b><b class="b1"></b><b class="hm"></b></div>
    <div id="sc"><small id="scl">실점</small><strong id="scv">0</strong></div>
  </div>
  <div id="info2"></div>
  <div id="banner"></div>
  <div id="fb"></div>
</div>

<div id="ctrl" class="hidden">
  <div id="pad"><canvas id="padc"></canvas><div id="padlbl"></div></div>
  <div id="mid"><div id="ptypes"></div><div id="hint"></div></div>
  <button id="act">던지기</button>
</div>

<div id="end" class="hidden">
  <div id="endbox">
    <h2 id="endTitle"></h2>
    <div id="endGrade"></div>
    <div id="endSub"></div>
    <div id="endStats"></div>
    <div class="endbtns"><button id="again" class="pri">다시하기</button><button id="toMenu">메인으로</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =====================================================================
   LOGIC : 물리 / 판정 / CPU 판단 (DOM, THREE 비의존)
   ===================================================================== */
'use strict';
const G=9.8, DRAG=0.0042, WALL_H=3.0;
const ZONE={x:0.25,y0:0.50,y1:1.12};
const PADR={x:0.55,y0:0.15,y1:1.45};
const S0=17.4/17.95;               // 투구가 홈플레이트 면(z=0)을 지나는 비율
const SWING_C=0.106, SWING_D=0.22; // 스윙 시작→접촉까지 / 전체 스윙 시간
const BASES=[{x:19.4,z:-19.4},{x:0,z:-38.8},{x:-19.4,z:-19.4},{x:0,z:0}];
const FIELDERS=[{x:0,z:-18.44},{x:0,z:2.0},{x:16.8,z:-22.5},{x:9.5,z:-32},{x:-9.5,z:-32},{x:-16.8,z:-22.5},{x:-36,z:-68},{x:0,z:-80},{x:36,z:-68}];

const rand=(a,b)=>a+Math.random()*(b-a);
const randn=()=>{let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* 펜스 거리 : phi = 중견수 방향 0°, 오른쪽(1루) +  */
function wallDist(phi){
  const a=Math.abs(phi);
  if(a<=45){const p=a/45;return 90+22*(1-p*p);}
  return lerp(90,40,smooth(45,180,a));
}

const PITCH_TYPES={
  fast:  {label:'직구',    dur:1.10,by:0.10,bx:0,    diff:0.85,ctl:1.00},
  slider:{label:'슬라이더',dur:1.25,by:0.05,bx:-0.55,diff:1.25,ctl:1.15},
  curve: {label:'커브',    dur:1.60,by:0.85,bx:-0.15,diff:1.15,ctl:1.30},
  change:{label:'체인지업',dur:1.50,by:0.18,bx:0,    diff:1.05,ctl:1.10}
};

function makePitch(type,tx,ty,pit){
  const T=PITCH_TYPES[type];
  const sg=(0.34-pit.control*0.026)*T.ctl;
  const x=tx+randn()*sg, y=ty+randn()*sg*0.85;
  const dur=T.dur*(1.14-pit.speed*0.022);
  const base={fast:128+pit.speed*3.0,slider:114+pit.speed*2.2,curve:100+pit.speed*2.0,change:108+pit.speed*2.2}[type];
  return {type,label:T.label,dur,kmh:Math.round(base+rand(-2,2)),
          R:{x:-0.3,y:1.9,z:-17.4},T:{x,y,z:0.55},bx:T.bx,by:T.by,diff:T.diff,tx,ty};
}
function pitchPos(p,s){
  const k=Math.sin(Math.PI*s);
  return {x:lerp(p.R.x,p.T.x,s)+p.bx*k, y:lerp(p.R.y,p.T.y,s)+p.by*k, z:lerp(p.R.z,p.T.z,s)};
}
const isStrike=(x,y)=>Math.abs(x)<=ZONE.x&&y>=ZONE.y0&&y<=ZONE.y1;
const swingWindow=c=>({W:0.10+c*0.0085,R:0.30+c*0.022});

/* 접촉 판정 : e=타이밍 오차(초, +는 늦음), d=배트-공 거리, vOff=공높이-배트높이 */
function evalContact(e,d,vOff,W,R,power,dir){
  const lateW=W*0.45;
  if(e<-W||e>lateW||d>R) return null;
  const tn=e<0?1-(-e)/W:1-e/lateW;
  const q=clamp(0.55*tn+0.45*(1-d/R),0,1);
  const norm=e<0?e/W:(e/lateW)*0.8;
  const phi=dir*norm*50+randn()*4.5;
  const L=clamp(11-vOff*80+randn()*(4+(1-q)*6),-12,72);
  const v0=(26+power*2.2)*(0.40+0.60*q);
  return {q,phi,L,v0,e,d,tn};
}

/* CPU 타자 : 스윙 여부 + 스윙 결과 */
function cpuAtBat(pitch,count,batter,pit){
  const pp=pitchPos(pitch,S0);
  const dx=Math.max(0,Math.abs(pp.x)-ZONE.x);
  const dy=pp.y<ZONE.y0?ZONE.y0-pp.y:(pp.y>ZONE.y1?pp.y-ZONE.y1:0);
  const out=Math.hypot(dx,dy);
  let ps=out===0?0.78:out<0.12?0.52:out<0.25?0.24:out<0.40?0.08:0.02;
  if(out>0) ps*=1.3-batter.eye*0.5;
  if(count.strikes===2) ps=Math.min(0.97,ps+(out<0.3?0.25:0.08));
  if(count.balls===3&&out>0) ps*=0.45;
  if(Math.random()>ps) return {swing:false,pp,out};
  const {W,R}=swingWindow(batter.contact);
  const sigE=W*(0.62+0.10*pitch.diff+0.03*(pit.speed-5));
  const sigD=R*(0.46+0.05*pitch.diff);
  const cn=Math.hypot(pp.x/ZONE.x,(pp.y-0.81)/0.31);
  const d=Math.hypot(randn()*sigD,randn()*sigD)+out*0.85+Math.max(0,cn-0.75)*0.06;
  const e=randn()*sigE;
  const vOff=randn()*0.11+(pp.y-0.81)*0.55;
  const contact=evalContact(e,d,vOff,W,R,batter.power,batter.side);
  return {swing:true,e,d,vOff,W,R,contact,pp,out};
}

/* CPU 투수 : 구종/코스 선택 */
function cpuPitchChoice(count,pit){
  const r=Math.random();
  let type=r<0.46?'fast':r<0.68?'slider':r<0.86?'curve':'change';
  if(count.strikes===2&&Math.random()<0.5) type=['slider','curve','change'][Math.random()*3|0];
  const pStrike=count.balls===3?0.92:(count.strikes===2?0.38:0.62);
  let tx,ty;
  if(Math.random()<pStrike){
    tx=rand(-0.2,0.2);ty=rand(0.6,1.04);
    if(Math.random()<0.45) tx=(Math.random()<0.5?-1:1)*rand(0.14,0.22);
  }else{
    const k=Math.random();
    if(k<0.4){tx=(Math.random()<0.5?-1:1)*rand(0.30,0.5);ty=rand(0.5,1.1);}
    else if(k<0.7){tx=rand(-0.2,0.2);ty=rand(0.22,0.44);}
    else{tx=rand(-0.2,0.2);ty=rand(1.2,1.38);}
  }
  return makePitch(type,tx,ty,pit);
}

/* 타구 시뮬레이션 (공기저항, 바운드, 구르기, 펜스) */
function simulateBall(x,y,z,v0,L,phi){
  const a=L*Math.PI/180,f=phi*Math.PI/180,dt=1/60;
  let vx=v0*Math.cos(a)*Math.sin(f),vy=v0*Math.sin(a),vz=-v0*Math.cos(a)*Math.cos(f);
  const tr=[{t:0,x,y,z}];
  let t=0,first=null,hr=null,wall=null,rolling=false;
  for(let i=0;i<60*12;i++){
    t+=dt;
    if(!rolling){
      const sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
      vx-=DRAG*sp*vx*dt; vz-=DRAG*sp*vz*dt; vy-=(G+DRAG*sp*vy)*dt;
      x+=vx*dt;y+=vy*dt;z+=vz*dt;
      if(y<=0&&vy<0){
        if(!first) first={t,x,z,idx:tr.length};
        y=0;vy=-vy*0.42;vx*=0.8;vz*=0.8;
        if(vy<1.4){vy=0;rolling=true;}
      }
    }else{
      const sp=Math.hypot(vx,vz),ns=sp-2.4*dt;
      if(ns<0.3){tr.push({t,x,y:0,z});break;}
      vx*=ns/sp;vz*=ns/sp;x+=vx*dt;z+=vz*dt;y=0;
    }
    const r=Math.hypot(x,z),ph=Math.atan2(x,-z)*180/Math.PI,wd=wallDist(ph);
    if(!hr&&r>=wd){
      if(y>=WALL_H&&Math.abs(ph)<=45){hr={t,x,y,z};}
      else{
        const ux=x/r,uz=z/r,vr=vx*ux+vz*uz;
        if(vr>0){vx-=1.35*vr*ux;vz-=1.35*vr*uz;}
        vy*=0.7;x=ux*(wd-0.2);z=uz*(wd-0.2);
        if(!wall) wall={t,x,y,z};
      }
    }
    if(hr&&(y<=0.05||r>wd+28)){tr.push({t,x,y:Math.max(y,0),z});break;}
    tr.push({t,x,y,z});
  }
  return {tr,first,hr,wall,tEnd:t};
}

/* 야수 추적 : 가장 먼저 공에 닿는 야수 */
function findIntercept(sim,sk){
  const SP=6.4*sk,REACT=0.32,REACH=1.2;
  const tr=sim.tr,hrT=sim.hr?sim.hr.t:1e9;
  let best=null;
  FIELDERS.forEach((f,fi)=>{
    for(let i=0;i<tr.length;i++){
      const p=tr[i];
      if(p.t>=hrT)break;
      if(p.y>2.6)continue;
      const d=Math.hypot(p.x-f.x,p.z-f.z);
      const need=Math.max(0,d-REACH)/SP+REACT;
      if(need<=p.t){if(!best||p.t<best.t)best={f:fi,i,t:p.t,x:p.x,y:p.y,z:p.z};break;}
    }
  });
  if(best)return best;
  const last=tr[tr.length-1];
  let bf=0,bn=1e9;
  FIELDERS.forEach((f,fi)=>{const d=Math.hypot(last.x-f.x,last.z-f.z);const need=Math.max(0,d-REACH)/SP+REACT;if(need<bn){bn=need;bf=fi;}});
  return {f:bf,i:tr.length-1,t:Math.max(last.t,bn),x:last.x,y:0,z:last.z,end:true};
}

/* 타구 결과 판정 */
function judgePlay(sim,info){
  const tr=sim.tr,last=tr[tr.length-1];
  if(Math.abs(info.phi)>45) return {type:'foul'};
  if(sim.hr) return {type:'hr',dist:Math.round(Math.hypot(last.x,last.z)),inPark:false};
  const sk=clamp(1+randn()*0.08,0.82,1.22);
  const c=findIntercept(sim,sk);
  const landD=Math.round(sim.first?Math.hypot(sim.first.x,sim.first.z):Math.hypot(last.x,last.z));
  const air=!c.end&&sim.first&&c.i<sim.first.idx&&c.y>0.05;
  const base={f:c.f,ti:c.t,px:c.x,pz:c.z,dist:landD};
  if(air){
    const kind=(c.f<=5&&info.L>=30)?'pop':(info.L>=22?'fly':'line');
    return Object.assign(base,{type:'out',kind,deep:landD>55});
  }
  const credit=(sim.first&&info.L>=8)?Math.min(sim.first.t,3.2)*0.45:0;
  const jit=randn()*0.12;
  const T=[4.35,8.6,12.9,17.2].map(v=>v-credit+jit);
  const arr=k=>c.t+0.5+Math.hypot(c.x-BASES[k-1].x,c.z-BASES[k-1].z)/30;
  if(arr(1)<=T[0]){
    return Object.assign(base,{type:'out',kind:'ground',throwTo:0,throwT:Math.hypot(c.x-BASES[0].x,c.z-BASES[0].z)/30});
  }
  let n=1;
  while(n<4&&T[n]<arr(n+1))n++;
  const bi=n-1;
  return Object.assign(base,{type:n>=4?'hr':(n===3?'3b':n===2?'2b':'1b'),inPark:n>=4,infield:c.f<=5&&n===1,
    throwTo:bi,throwT:Math.hypot(c.x-BASES[bi].x,c.z-BASES[bi].z)/30});
}

/* 포즈 */
const _d=new V3(),_up=new V3(0,1,0),_t1=new V3(),_s1=new V3();
function stretch(m,a,b){
  _d.subVectors(b,a);const len=_d.length();
  m.position.copy(a).addScaledVector(_d,0.5);
  m.scale.set(1,Math.max(len,0.01),1);
  m.quaternion.setFromUnitVectors(_up,_d.normalize());
}
function armsToBat(P){
  const bat=P.bat;
  _t1.set(0,0.03,0).applyEuler(bat.rotation).add(bat.position);
  _s1.set(0.26,0.6,0);stretch(P.limbL,_s1,_t1);
  _t1.set(0,0.14,0).applyEuler(bat.rotation).add(bat.position);
  _s1.set(-0.26,0.6,0);stretch(P.limbR,_s1,_t1);
}
function poseBatter(P,sd,p,hy,rx){
  const up=P.upper,bat=P.bat;
  if(p<0){
    up.rotation.y=sd*-1.3;bat.position.set(-0.14*sd,0.55,0.22);bat.rotation.set(0,0,0.38*sd);
  }else{
    up.rotation.y=sd*lerp(-1.5,1.7,p);
    const flat=clamp(p/0.46,0,1);
    const pitch=p<0.5?lerp(0.1,Math.PI/2,1-(1-flat)*(1-flat)):lerp(Math.PI/2,2.5,(p-0.5)/0.5);
    bat.rotation.set(pitch,0,0.38*sd*(1-flat));
    const ty=hy/P.hs-0.95,hzl=0.28+sd*rx;
    const y=p<0.5?lerp(0.55,ty,flat):lerp(ty,0.62,(p-0.5)/0.5);
    bat.position.set(-0.14*sd*(1-flat),y,lerp(0.22,hzl,flat));
  }
  armsToBat(P);
}
function posePitch(P,t){
  const ez=x=>x*x*(3-2*x);
  const A=clamp(t/0.5,0,1),B=clamp((t-0.5)/0.3,0,1),C=clamp((t-0.8)/0.3,0,1);
  const th=t<0.5?lerp(0,-3.4,ez(A)):(t<0.8?lerp(-3.4,-0.5,B*B):lerp(-0.5,0.2,ez(C)));
  P.armR.rotation.x=th;P.armR.userData.fore.rotation.x=lerp(0,-0.4,ez(A))*(1-C);
  P.armL.rotation.x=lerp(-0.5,-1.1,ez(A))*(1-C*0.6);P.armL.userData.fore.rotation.x=-0.9;
  P.upper.rotation.x=t<0.5?lerp(0,-0.22,ez(A)):(t<0.8?lerp(-0.22,0.55,ez(B)):lerp(0.55,0.4,C));
  P.legL.rotation.x=t<0.5?lerp(0,-1.15,ez(A)):(t<0.8?lerp(-1.15,-0.25,ez(B)):-0.25);
  P.legR.rotation.x=lerp(0,0.1,ez(B));
  P.root.position.z=-18.44-0.3*ez(A)+1.2*ez(B);
}
function resetPitcherPose(P){
  P.armR.rotation.x=-0.4;P.armR.userData.fore.rotation.x=-0.5;P.armL.rotation.x=-0.5;P.armL.userData.fore.rotation.x=-0.6;
  P.upper.rotation.x=0;P.legL.rotation.x=0;P.legR.rotation.x=0;P.root.position.z=-18.44;
}
function animRun(P,ph,k){
  if(!P.armL)return;
  if(k===0){P.legL.rotation.x=0;P.legR.rotation.x=0;P.armL.rotation.x=-0.5;P.armR.rotation.x=-0.4;P.upper.rotation.x=0;return;}
  P.legL.rotation.x=Math.sin(ph)*0.9*k;P.legR.rotation.x=-Math.sin(ph)*0.9*k;
  P.armL.rotation.x=-0.5-Math.sin(ph)*0.6*k;P.armR.rotation.x=-0.5+Math.sin(ph)*0.6*k;P.upper.rotation.x=0.12*k;
}

let AC=null;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,v,slide){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(v||0.15,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
}
function noise(d,v,f){
  const a=ac();if(!a)return;
  const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
  for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=buf;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f||1200;
  const g=a.createGain();g.gain.value=v||0.3;
  s.connect(bp);bp.connect(g);g.connect(a.destination);s.start();
}

const rig={pos:new V3(0,3,-20),look:new V3(0,1,0),fov:36,gPos:new V3(0,3,-20),gLook:new V3(0,1,0),gFov:36,k:3};
function camGoal(px,py,pz,lx,ly,lz,fov,k,snap){
  rig.gPos.set(px,py,pz);rig.gLook.set(lx,ly,lz);rig.gFov=fov;rig.k=k||3;
  if(snap){rig.pos.copy(rig.gPos);rig.look.copy(rig.gLook);rig.fov=fov;}

  camera.position.copy(rig.pos);camera.lookAt(rig.look);
  if(Math.abs(camera.fov-rig.fov)>0.01){camera.fov=rig.fov;camera.updateProjectionMatrix();}
}

function sizePad(){

  padc.width=Math.max(10,Math.round(r.width*padDPR));padc.height=Math.max(10,Math.round(r.height*padDPR));

function drawPad(){
  if($('ctrl').classList.contains('hidden'))return;
  const g=padg,w=padc.width,h=padc.height;
  g.clearRect(0,0,w,h);
  const X=u=>(u+PADR.x)/(2*PADR.x)*w,Y=y=>(PADR.y1-y)/(PADR.y1-PADR.y0)*h;
  const zx0=X(-ZONE.x),zx1=X(ZONE.x),zy0=Y(ZONE.y1),zy1=Y(ZONE.y0);
  g.fillStyle='rgba(255,255,255,0.08)';g.fillRect(zx0,zy0,zx1-zx0,zy1-zy0);
  g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=2*padDPR;g.strokeRect(zx0,zy0,zx1-zx0,zy1-zy0);
  g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=1*padDPR;g.beginPath();
  for(let i=1;i<3;i++){g.moveTo(zx0+(zx1-zx0)*i/3,zy0);g.lineTo(zx0+(zx1-zx0)*i/3,zy1);g.moveTo(zx0,zy0+(zy1-zy0)*i/3);g.lineTo(zx1,zy0+(zy1-zy0)*i/3);}
  g.stroke();
  // 직전 투구 위치 (투수 모드)
  if(S.mode==='pitcher'&&S.lastPlane&&clock-S.lastPlaneT<2.2){
    g.fillStyle='rgba(255,255,255,0.95)';g.beginPath();g.arc(X(vs()*S.lastPlane.x),Y(S.lastPlane.y),5*padDPR,0,6.283);g.fill();
  }
  // 날아오는 공 (타자 모드)
  if(S.mode==='batter'&&S.phase==='pitch'&&S.released&&S.pitch&&!S.arrived){
    const s=clamp((S.pt-TR)/S.pitch.dur,0,1);
    if(s>0.3){const p=pitchPos(S.pitch,s);g.fillStyle='rgba(255,255,255,'+clamp((s-0.3)*1.6,0,0.9)+')';g.beginPath();g.arc(X(p.x),Y(p.y),5*padDPR,0,6.283);g.fill();}
  }

  g.beginPath();g.arc(ax,ay,(S.mode==='pitcher'?9:15)*padDPR,0,6.283);g.stroke();
  g.beginPath();g.moveTo(ax-14*padDPR,ay);g.lineTo(ax+14*padDPR,ay);g.moveTo(ax,ay-14*padDPR);g.lineTo(ax,ay+14*padDPR);g.stroke();
}

function buildPitchButtons(){
  const el=$('ptypes');el.innerHTML='';
  Object.keys(PITCH_TYPES).forEach(k=>{
    const b=document.createElement('button');b.textContent=PITCH_TYPES[k].label;b.dataset.k=k;if(k===S.sel)b.className='on';
    b.addEventListener('pointerdown',e=>{S.sel=k;[...el.children].forEach(c=>c.className=c.dataset.k===k?'on':'');e.preventDefault();});
    el.appendChild(b);
  });
}
function setCtrlMode(){
  const pm=S.mode==='pitcher';
  $('ptypes').style.display=pm?'grid':'none';
  $('act').textContent=pm?'던지기':'스윙!';
  $('padlbl').textContent=pm?'코스 지정':'배트 위치';
  $('hint').innerHTML=pm?'패드에서 코스를 정하고<br>구종을 골라 던지세요':'패드로 배트 높이·위치 지정<br>공이 올 때 스윙! (화면 탭도 OK)';
}
function ctrlEnabled(on){$('act').disabled=!on;}

/* =====================================================================
   게임 흐름
   ===================================================================== */
function startGame(){
  ac();
  S.over=false;S.outs=0;S.balls=0;S.strikes=0;S.bases=[0,0,0];S.runs=0;S.pts=0;S.newPA=false;
  S.st={pitches:0,k:0,bb:0,h:0,hr:0,swings:0,whiff:0,best:0,perfect:0};
  S.opp=null;S.sel='fast';
  setupGame();setCtrlMode();buildPitchButtons();
  $('menu').classList.add('hidden');$('end').classList.add('hidden');
  $('hud').classList.remove('hidden');$('ctrl').classList.remove('hidden');
  sizePad();
  ballHide();resetPoses();hud();
  pitchCam(true);
  S.phase='idle';S.timer=1.4;ctrlEnabled(S.mode==='pitcher');
  banner('PLAY BALL!','strike',1300,S.mode==='pitcher'?'3아웃을 잡아라':'1아웃 전까지 최대한 쳐라');
}

function showMenu(){
  disposeGroup(actors);actors=null;fielders=[];
  $('hud').classList.add('hidden');$('ctrl').classList.add('hidden');$('end').classList.add('hidden');$('menu').classList.remove('hidden');
  ballHide();S.phase='menu';
  refreshMenu();menuCam(true);
}

function throwPitch(){
  if(S.phase!=='idle'||S.mode!=='pitcher')return;
  ac();
  const ch=CHARS[S.ch],pit={speed:ch.speed,control:ch.control};
  S.pitch=makePitch(S.sel,vs()*aimU,aimY,pit);
  S.cpu=cpuAtBat(S.pitch,{balls:S.balls,strikes:S.strikes},S.opp,pit);
  beginPitch();
}
function cpuThrow(){
  S.pitch=cpuPitchChoice({balls:S.balls,strikes:S.strikes},OPP_PIT);
  S.cpu=null;
  beginPitch();
}
function beginPitch(){
  S.phase='pitch';S.pt=0;S.released=false;S.arrived=false;S.swing=null;
  ctrlEnabled(S.mode==='batter');
  const TP=TR+S0*S.pitch.dur;
  if(S.mode==='pitcher'&&S.cpu&&S.cpu.swing){
    const c=S.cpu,contactAt=TP+c.e;
    S.swing={start:contactAt-SWING_C,contactAt,rx:c.pp.x+randn()*0.04,ry:c.pp.y-c.vOff,user:false,done:false};
  }
}
function swingPress(){
  if(S.mode!=='batter'||S.phase!=='pitch'||!S.released||S.swing||S.arrived)return;
  S.swing={start:S.pt,contactAt:S.pt+SWING_C,rx:aimU,ry:aimY,user:true,done:false};
  S.st.swings++;
}
function act(){ac();if(S.mode==='pitcher')throwPitch();else swingPress();}

function updateIdle(dt){
  if(S.mode==='batter'){
    poseBatter(batterP,1,-1,0,0);
    S.timer-=dt;if(S.timer<=0)cpuThrow();
  }
}

function updatePitch(dt){
  S.pt+=dt;const pi=S.pitch;
  posePitch(pitcherP,S.pt);
  if(!S.released&&S.pt>=TR){
    S.released=true;trailClear();sfx.whiff();
    showInfo(pi.label+' '+pi.kmh+'km/h');
  }
  let s=0;
  if(S.released){
    s=Math.min((S.pt-TR)/pi.dur,1);
    const bp=pitchPos(pi,s);setBall(bp);trailPush(bp);
    if(s>0.55){
      const tgt=_t1.set(pi.T.x,pi.T.y,0.95);mitt.position.lerp(tgt,1-Math.exp(-9*dt));
    }
  }
  if(S.swing&&S.pt>=S.swing.start){
    const p=clamp((S.pt-S.swing.start)/SWING_D,0,1);
    poseBatter(batterP,batSide(),p,S.swing.ry,S.swing.rx);
  }else poseBatter(batterP,batSide(),-1,0,0);
  if(S.swing&&!S.swing.done&&S.pt>=S.swing.contactAt){
    S.swing.done=true;resolveSwing();
    if(S.phase!=='pitch')return;
  }
  if(!S.arrived&&S.released&&s>=1&&(!S.swing||S.swing.done)){
    S.arrived=true;onArrive();
  }
}

function resolveSwing(){
  const sw=S.swing,pp=pitchPos(S.pitch,S0);
  let ct=null;
  if(sw.user){
    const ch=CHARS[S.ch],win=swingWindow(ch.contact);
    const e=sw.contactAt-(TR+S0*S.pitch.dur);
    const d=Math.hypot(pp.x-sw.rx,pp.y-sw.ry),vOff=pp.y-sw.ry;
    ct=evalContact(e,d,vOff,win.W,win.R,ch.power,1);
    if(ct){
      feedback(ct.q>0.88?'PERFECT!':(ct.q>0.65?'GOOD':(e<0?'조금 빨랐어요':'조금 늦었어요')),ct.q>0.88?'#ffd23a':'#fff',800);
    }else{
      if(e<-win.W)feedback('너무 빨랐어요','#7dd3fc',800);
      else if(e>win.W*0.45)feedback('너무 늦었어요','#fca5a5',800);
      else feedback('코스가 빗나갔어요','#fcd34d',800);
    }
  }else ct=S.cpu.contact;
  if(ct){
    if(ct.q>0.88)S.st.perfect++;
    startPlay(ct,pp);
  }else{sfx.whiff();S.st.whiff++;}
}

function onArrive(){
  const pp=pitchPos(S.pitch,S0);
  sfx.pop();flashAt({x:S.pitch.T.x,y:S.pitch.T.y,z:0.7},0.7,0.25);
  S.lastPlane={x:pp.x,y:pp.y};S.lastPlaneT=clock;
  const kind=S.swing?'swing':(isStrike(pp.x,pp.y)?'called':'ball');
  applyResult(kind);
}

/* ---------- 타구 ---------- */
function startPlay(ct,pp){
  const sim=simulateBall(pp.x,pp.y,0,ct.v0,ct.L,ct.phi);
  const res=judgePlay(sim,{L:ct.L,phi:ct.phi,q:ct.q});
  S.phase='play';ctrlEnabled(false);
  const pl=S.play={sim,res,t:0,ct,announced:false,dwell:1.7};
  if(res.type==='hr'&&!res.inPark){pl.te=sim.hr.t;pl.dwell=2.8;}
  else if(res.type==='foul')pl.te=sim.first?Math.max(sim.first.t,0.7):1.4;
  else if(res.type==='out')pl.te=res.kind==='ground'?res.ti+0.3+res.throwT:res.ti;
  else{pl.te=res.ti;if(res.type==='hr')pl.dwell=2.8;}
  if(res.ti!=null){
    const ff=fielders[res.f];
    const dist=Math.hypot(res.px-ff.x,res.pz-ff.z);
    ff.tx=res.px;ff.tz=res.pz;ff.delay=0.3;ff.spd=clamp(dist/Math.max(0.3,res.ti-0.32),2,11);
  }
  const lx=sim.first?sim.first.x:sim.tr[sim.tr.length-1].x,lz=sim.first?sim.first.z:sim.tr[sim.tr.length-1].z;
  fielders.forEach((f,i)=>{if(res.ti!=null&&i===res.f)return;f.tx=lerp(f.hx,lx,0.2);f.tz=lerp(f.hz,lz,0.2);f.spd=4;f.delay=0.35;});
  const f0=fielders[0];f0.x=f0.P.root.position.x;f0.z=f0.P.root.position.z;
  setBall(pp);sfx.hit();flashAt({x:pp.x,y:pp.y,z:0},1.6,0.28);
  mitt.position.copy(mittHome);
  S.st.pitches=S.st.pitches; // (카운트는 결과 적용 시 증가)
}
function trackPos(tr,t){
  const f=t*60,i=Math.min(Math.floor(f),tr.length-1),j=Math.min(i+1,tr.length-1),k=f-i;
  return {x:lerp(tr[i].x,tr[j].x,k),y:lerp(tr[i].y,tr[j].y,k),z:lerp(tr[i].z,tr[j].z,k)};
}
function playBall(pl){
  const t=pl.t,r=pl.res;
  if(r.ti==null||t<r.ti)return trackPos(pl.sim.tr,t);
  const ff=fielders[r.f],hold=0.3;
  if(r.throwTo!=null&&t>=r.ti+hold){
    const k=clamp((t-r.ti-hold)/Math.max(0.2,r.throwT),0,1),b=BASES[r.throwTo];
    return {x:lerp(ff.x,b.x,k),y:1.3+Math.sin(Math.PI*k)*1.4,z:lerp(ff.z,b.z,k)};
  }
  return {x:ff.x,y:1.15,z:ff.z+0.15};
}
function updatePlay(dt){
  const pl=S.play;pl.t+=dt;
  const bp=playBall(pl);setBall(bp);trailPush(bp);
  // 카메라 추적
  const dist=Math.hypot(bp.x,bp.z);
  camGoal(bp.x*0.12,5.2+dist*0.035,9.5+dist*0.05,bp.x*0.85,Math.min(bp.y,30)*0.6+1,bp.z*0.9,lerp(54,30,clamp(dist/80,0,1)),4.5);
  if(!pl.announced&&pl.t>=pl.te){pl.announced=true;announcePlay();}
  if(pl.announced&&pl.t>=pl.te+pl.dwell){
    if(S.phase==='play'){S.phase='result';S.timer=0;}
  }
}
function announcePlay(){
  const pl=S.play,r=pl.res,ct=pl.ct;
  if(r.type==='foul'){applyResult('foul',{fromPlay:true});return;}
  if(r.type==='out'){
    const txt={ground:'땅볼 아웃',fly:'뜬공 아웃',pop:'내야 플라이',line:'라인드라이브 아웃'}[r.kind];
    applyResult('out',{text:txt,kind:r.kind,deep:r.deep,fromPlay:true});return;
  }
  if(r.type==='hr'){applyResult('hr',{dist:r.dist,inPark:r.inPark,fromPlay:true});return;}
  applyResult(r.type,{infield:r.infield,dist:r.dist,fromPlay:true});
}

/* ---------- 주자 처리 (투수 모드) ---------- */
function hitAdvance(n){
  const b=S.bases;let runs=0,nb=[0,0,0];
  if(n>=4){runs=b.filter(Boolean).length+1;}
  else if(n===3){runs=b.filter(Boolean).length;nb=[0,0,1];}
  else if(n===2){
    runs=(b[1]?1:0)+(b[2]?1:0);nb=[0,1,0];
    if(b[0]){if(Math.random()<0.5)runs++;else nb[2]=1;}
  }else{
    nb=[1,0,0];
    if(b[2])runs++;
    if(b[1]){if(Math.random()<0.6)runs++;else nb[2]=1;}
    if(b[0]){if(!nb[2]&&Math.random()<0.25)nb[2]=1;else nb[1]=1;}
  }
  S.bases=nb;return runs;
}
function walkAdvance(){
  const b=S.bases;let runs=0;
  if(b[0]){if(b[1]){if(b[2])runs=1;b[2]=1;}b[1]=1;}
  b[0]=1;return runs;
}
function outAdvance(kind,deep){
  const b=S.bases;let added=1,runs=0,dp=false;
  if(kind==='ground'){
    if(b[0]&&S.outs<2&&Math.random()<0.45){dp=true;added=2;b[0]=0;if(b[2]){runs++;b[2]=0;}if(b[1]){b[2]=1;b[1]=0;}}
    else{if(b[2]){runs++;b[2]=0;}if(b[1]){b[2]=1;b[1]=0;}if(b[0]){b[1]=1;b[0]=0;}}
  }else if((kind==='fly'||kind==='line')&&deep&&S.outs<2&&b[2]){runs++;b[2]=0;}
  if(S.outs+added>=3)runs=0;
  return {added,runs,dp};
}

/* ---------- 결과 적용 ---------- */
function addOut(n){S.outs+=n;if(S.outs>=limit())S.over=true;}
function scoreRuns(n){if(n>0&&S.mode==='pitcher'){S.runs+=n;}}
function toResult(sec){S.phase='result';S.timer=sec;ctrlEnabled(false);}

function applyResult(kind,info){
  info=info||{};
  const pm=S.mode==='pitcher';
  S.st.pitches++;
  let end=false;
  switch(kind){
    case 'ball':
      S.balls++;
      if(S.balls>=4){S.st.bb++;end=true;if(pm)scoreRuns(walkAdvance());else S.pts+=1;banner('BALL 4','ball',1300,'볼넷 · 1루 출루');}
      else banner('BALL','ball',900);
      break;
    case 'called':
      S.strikes++;
      if(S.strikes>=3){S.st.k++;end=true;addOut(1);banner('삼진!','out',1400,'루킹 삼진');sfx.cheer();}
      else banner('STRIKE','strike',900);
      break;
    case 'swing':
      S.strikes++;
      if(S.strikes>=3){S.st.k++;end=true;addOut(1);banner('삼진!','out',1400,'헛스윙 삼진');sfx.cheer();}
      else banner('헛스윙!','strike',900);
      break;
    case 'foul':
      if(S.strikes<2)S.strikes++;
      banner('FOUL','foul',900);
      break;
    case 'out':{
      end=true;
      let txt=info.text;
      if(pm){const r=outAdvance(info.kind,info.deep);addOut(r.added);scoreRuns(r.runs);if(r.dp)txt+=' · 병살!';if(r.runs)txt+=' (희생타점)';}
      else addOut(1);
      banner('OUT','out',1500,txt);
      if(pm)sfx.cheer();
      break;
    }
    case '1b':case '2b':case '3b':{
      end=true;S.st.h++;
      const n=kind==='1b'?1:kind==='2b'?2:3;
      let runs=0;
      if(pm)runs=hitAdvance(n);else S.pts+=n;
      scoreRuns(runs);
      const name=kind==='1b'?(info.infield?'내야 안타':'안타'):kind==='2b'?'2루타':'3루타';
      banner(name,'hit',1600,pm?(runs?runs+'점 실점':''):(n+'점 획득'));
      sfx.cheer();
      break;
    }
    case 'hr':{
      end=true;S.st.h++;S.st.hr++;
      let runs=0;
      if(pm)runs=hitAdvance(4);else S.pts+=4;
      scoreRuns(runs);
      if(!info.inPark)S.st.best=Math.max(S.st.best,info.dist||0);
      banner(info.inPark?'그라운드 홈런!':'홈런!!','hr',2600,(info.inPark?'':'비거리 '+info.dist+'m · ')+(pm?runs+'점 실점':'4점 획득'));
      sfx.cheer();
      break;
    }
  }
  if(end){S.newPA=true;}
  hud();
  if(!info.fromPlay)toResult(end?1.5:1.0);
}

function afterResult(){
  if(S.over){finishGame();return;}
  nextPitch();
}
function nextPitch(){
  ballHide();
  S.play=null;
  if(S.newPA){S.newPA=false;S.balls=0;S.strikes=0;if(S.mode==='pitcher')newOppBatter();}
  resetPoses();pitchCam(false);
  S.phase='idle';S.timer=1.0;S.swing=null;
  ctrlEnabled(S.mode==='pitcher');
  hud();
}

function finishGame(){
  S.phase='over';ctrlEnabled(false);
  setTimeout(()=>{
    const pm=S.mode==='pitcher',st=S.st;
    let grade,title,sub,stats;
    if(pm){
      grade=S.runs===0?'S':S.runs===1?'A':S.runs===2?'B':S.runs===3?'C':'D';
      title=S.runs===0?'무실점 이닝! 🎉':'이닝 종료';
      sub=CHARS[S.ch].name+' · '+st.pitches+'구 '+S.runs+'실점';
      stats=[['실점',S.runs],['삼진',st.k],['피안타',st.h],['피홈런',st.hr],['볼넷',st.bb],['투구수',st.pitches]];
    }else{
      grade=S.pts>=8?'S':S.pts>=5?'A':S.pts>=3?'B':S.pts>=1?'C':'D';
      title='아웃! 경기 종료';
      sub=CHARS[S.ch].name+' · '+S.pts+'점 획득';
      stats=[['점수',S.pts],['안타',st.h],['홈런',st.hr],['최장 비거리',st.best?st.best+'m':'-'],['퍼펙트',st.perfect],['본 공',st.pitches]];
    }
    $('endTitle').textContent=title;$('endGrade').textContent=grade;$('endSub').textContent=sub;
    $('endStats').innerHTML=stats.map(s=>'<div>'+s[0]+'<b>'+s[1]+'</b></div>').join('');
    $('end').classList.remove('hidden');
  },900);
}

/* =====================================================================
   메뉴
   ===================================================================== */
function refreshMenu(){
  const pm=S.mode==='pitcher',ch=CHARS[S.ch];
  $('sub').textContent=pm?'마운드에서 한 이닝, 3아웃을 잡아라':'타석에서 1아웃 전까지 최대한 쳐라';
  [...$('modeSeg').children].forEach(b=>b.className=b.dataset.m===S.mode?'on':'');
  [...$('chars').children].forEach((b,i)=>b.className=i===S.ch?'on':'');
  $('cdesc').textContent=ch.desc;
  const rows=[['구속','speed',pm],['제구','control',pm],['파워','power',!pm],['정확','contact',!pm]];
  $('stats').innerHTML=rows.map(r=>'<div class="st'+(r[2]?'':' dim')+'"><span>'+r[0]+'</span><i><u style="width:'+ch[r[1]]*10+'%"></u></i></div>').join('');
  disposeGroup(showcase);
  showcase=new THREE.Group();
  const P=buildPerson({role:pm?'pitcher':'batter',glove:pm,shirt:ch.shirt,cap:ch.cap,pants:ch.pants,skin:ch.skin,w:ch.w,h:ch.h});
  if(!pm)poseBatter(P,1,-1,0,0);
  P.root.position.set(0,0,0);showcase.add(P.root);showcase.position.set(0,0,-9);
  scene.add(showcase);
}
(function initMenu(){
  CHARS.forEach((c,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<i style="background:#'+c.shirt.toString(16).padStart(6,'0')+'"></i>'+c.name;
    b.addEventListener('click',()=>{S.ch=i;sfx.tick();refreshMenu();});
    $('chars').appendChild(b);
  });
  [...$('modeSeg').children].forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.m;sfx.tick();refreshMenu();}));
  $('start').addEventListener('click',startGame);
  $('again').addEventListener('click',startGame);
  $('toMenu').addEventListener('click',showMenu);
})();

/* ---------- 입력 ---------- */
$('act').addEventListener('pointerdown',e=>{e.preventDefault();act();});
$('c').addEventListener('pointerdown',e=>{if(S.mode==='batter'&&S.phase==='pitch'){e.preventDefault();act();}});
window.addEventListener('keydown',e=>{
  if(S.phase==='menu'||S.phase==='over')return;
  const k=e.key;
  if(k===' '||k==='Enter'){e.preventDefault();act();}
  else if(k==='ArrowLeft'){aimU=clamp(aimU-0.04,-PADR.x,PADR.x);e.preventDefault();}
  else if(k==='ArrowRight'){aimU=clamp(aimU+0.04,-PADR.x,PADR.x);e.preventDefault();}
  else if(k==='ArrowUp'){aimY=clamp(aimY+0.04,PADR.y0,PADR.y1);e.preventDefault();}
  else if(k==='ArrowDown'){aimY=clamp(aimY-0.04,PADR.y0,PADR.y1);e.preventDefault();}
  else if(S.mode==='pitcher'&&'1234'.includes(k)&&k.length===1){
    const ks=Object.keys(PITCH_TYPES);S.sel=ks[+k-1];
    [...$('ptypes').children].forEach(c=>c.className=c.dataset.k===S.sel?'on':'');
  }
});

/* ---------- 메인 루프 ---------- */
function update(dt){
  clock+=dt;
  if(fielders.length)updateFielders(dt);
  updateFx(dt);
  switch(S.phase){
    case 'menu':if(showcase)showcase.rotation.y=-0.45+Math.sin(clock*0.7)*0.35;break;
    case 'idle':updateIdle(dt);break;
    case 'pitch':updatePitch(dt);break;
    case 'play':updatePlay(dt);break;
    case 'result':S.timer-=dt;if(S.timer<=0)afterResult();break;
  }
  drawPad();
}
let lastT=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))return;dt=Math.min(dt,0.05);
  update(dt);updateCam(dt);
  renderer.render(scene,camera);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();refreshMenu();menuCam(true);
requestAnimationFrame(tick);
window.__baseball={S,update,startGame};
})();
